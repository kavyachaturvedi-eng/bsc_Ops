<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<title>BSC Ops Core</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --ground:#F6F5F2; --card:#FFFFFF; --ink:#1C2128; --muted:#5C6470; --line:#E3E1DB;
  --rail:#232B3A; --rail-ink:#B9C0CF; --rail-active:#FFFFFF; --rail-hi:#2E3950;
  --accent:#3E4F82; --accent-soft:#E8EBF4;
  --ok:#2E7D5B; --ok-soft:#E2F0E9; --warn:#B07818; --warn-soft:#F7EDD8; --crit:#B3432B; --crit-soft:#F6E2DC;
  --assum:#6B5CA5; --assum-soft:#EDE9F6;
  --mono:'JetBrains Mono',ui-monospace,monospace; --ui:'Archivo',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--ui);background:var(--ground);color:var(--ink);font-size:14px;line-height:1.45}
button{font-family:var(--ui);cursor:pointer;border:none;background:none;font-size:13px}
.app{display:flex;flex-direction:column;height:100vh;overflow:hidden}

/* ---------- top bar ---------- */
.topbar{display:flex;align-items:center;gap:16px;height:52px;padding:0 16px;background:var(--card);border-bottom:1px solid var(--line);flex-shrink:0}
.brand{display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.brand b{font-size:15px;font-weight:700;letter-spacing:.01em}
.brand span{font-size:10px;font-weight:600;letter-spacing:.09em;color:var(--assum);border:1px solid var(--assum);border-radius:3px;padding:1px 5px}
.portals{display:flex;gap:2px;background:var(--ground);border:1px solid var(--line);border-radius:8px;padding:3px}
.portals button{padding:5px 12px;border-radius:6px;font-weight:600;color:var(--muted)}
.portals button.on{background:var(--rail);color:#fff}
.pills{display:flex;gap:8px;margin-left:auto;align-items:center}
.pill{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--muted);background:var(--ground);border:1px solid var(--line);border-radius:20px;padding:4px 11px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.dot.amber{background:var(--warn)}
.assum-toggle{font-weight:600;color:var(--assum);background:var(--assum-soft);border:1px solid #D6CEEB;border-radius:20px;padding:4px 12px}
.assum-toggle.on{background:var(--assum);color:#fff}

/* ---------- layout ---------- */
.main{display:flex;flex:1;min-height:0}
.rail{width:236px;background:var(--rail);color:var(--rail-ink);overflow-y:auto;flex-shrink:0;padding:10px 0 30px}
.rail::-webkit-scrollbar{width:0}
.mod>button{display:flex;align-items:center;width:100%;padding:9px 16px;color:var(--rail-ink);font-weight:600;font-size:13px;text-align:left;gap:8px}
.mod>button:hover{color:#fff}
.mod .chev{margin-left:auto;transition:transform .15s;font-size:10px;opacity:.6}
.mod.open .chev{transform:rotate(90deg)}
.sub{display:none;padding:2px 0 6px}
.mod.open .sub{display:block}
.sub button{display:block;width:100%;text-align:left;padding:6px 16px 6px 34px;color:var(--rail-ink);font-size:12.5px;border-left:2px solid transparent}
.sub button:hover{color:#fff}
.sub button.on{color:var(--rail-active);background:var(--rail-hi);border-left-color:#8FA3D9;font-weight:600}
.rail .grp{padding:14px 16px 4px;font-size:10px;font-weight:700;letter-spacing:.12em;color:#6E7A93}
.sec{margin-top:15px;position:relative}
.sec::before{content:"";position:absolute;left:8px;top:30px;bottom:6px;width:2px;border-radius:2px;background:#39435C}
.sec.mtm::before{background:#4C8494}
.sec.rtw::before{background:#9A6B36}
.sechead{padding:7px 16px 7px;font-size:10.5px;font-weight:800;letter-spacing:.11em;color:#6E7A93}
.sechead span{display:block;font-size:9.5px;font-weight:600;letter-spacing:.02em;text-transform:none;opacity:.62;margin-top:2px}
.sec.mtm .sechead{color:#7FC3D3}
.sec.rtw .sechead{color:#D9A468}
.mod>button.lvl1{font-size:13px}
.mod>button.lvl1.on1{color:#fff}
.mod>button.lvl2{padding:8px 16px 8px 22px;font-size:12.5px;font-weight:600}
.sec .sub button{padding-left:38px}

/* ---------- content ---------- */
.content{flex:1;overflow-y:auto;padding:22px 26px 60px}
.vhead{margin-bottom:16px}
.vhead h1{font-size:20px;font-weight:700;letter-spacing:-.01em}
.vhead p{color:var(--muted);font-size:13px;margin-top:3px;max-width:70ch}
.crumb{font-size:11px;font-weight:600;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;margin-bottom:4px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer}
.kpi:hover{border-color:var(--accent)}
.kpi b{display:block;font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted)}
.kpi.crit b{color:var(--crit)} .kpi.warn b{color:var(--warn)} .kpi.ok b{color:var(--ok)}

.card{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:16px;overflow:hidden}
.card .chead{display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid var(--line)}
.card .chead h2{font-size:14px;font-weight:700}
.card .chead .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.tblwrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:#FBFAF8}
td{padding:9px 14px;border-bottom:1px solid #EFEDE8;vertical-align:top}
tr:last-child td{border-bottom:none}
tr.rowlink:hover td{background:#F7F8FB;cursor:pointer}
td .sub2{display:block;font-size:11.5px;color:var(--muted);margin-top:1px}
.code{font-family:var(--mono);font-size:12px;font-weight:600}
.codelink{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--accent);border-bottom:1px dotted var(--accent);cursor:pointer}
.codelink:hover{background:var(--accent-soft)}
.fabsearch{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:16px}
.fabsearch input{width:100%;font-family:var(--ui);font-size:13.5px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--ground);color:var(--ink)}
.fabsearch input:focus{outline:2px solid var(--accent);outline-offset:1px;background:var(--card)}
.fabres{display:grid;gap:4px;margin-top:9px;max-height:196px;overflow-y:auto}
.fabopt{display:grid;grid-template-columns:150px 1fr 110px 120px;gap:10px;align-items:center;text-align:left;padding:7px 10px;border-radius:7px;border:1px solid transparent}
.fabopt:hover{background:var(--ground);border-color:var(--line)}
.fabopt.on{background:var(--accent-soft);border-color:var(--accent);font-weight:600}
.fabhint{font-size:11.5px;color:var(--muted);margin-top:8px}
.spine{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.09em;border-radius:4px;padding:2px 7px;margin-bottom:7px}
.sp-mtm{background:#E4EEF0;color:#1F6070}
.sp-rtw{background:#F2EAE2;color:#8A5A2B}
.sp-both{background:#EAEAF2;color:#4A4A6A}
.rail .grp.mtm{color:#7FC3D3}
.rail .grp.rtw{color:#D9A468}
@media(max-width:900px){.fabopt{grid-template-columns:1fr;gap:2px}}
.num{font-variant-numeric:tabular-nums;text-align:right}
th.num{text-align:right}

.badge{display:inline-block;font-size:11px;font-weight:600;border-radius:12px;padding:2px 9px;white-space:nowrap}
.b-ok{background:var(--ok-soft);color:var(--ok)} .b-warn{background:var(--warn-soft);color:var(--warn)}
.b-crit{background:var(--crit-soft);color:var(--crit)} .b-mut{background:#EEECE7;color:var(--muted)}
.b-acc{background:var(--accent-soft);color:var(--accent)}
.chip{display:inline-block;font-family:var(--mono);font-size:10px;font-weight:600;color:var(--assum);background:var(--assum-soft);border:1px dashed #C9BEE6;border-radius:4px;padding:1px 5px;margin-left:6px;cursor:help;vertical-align:1px}
body.hi-assum .chip{background:var(--assum);color:#fff;border-style:solid}

.btn{border-radius:7px;padding:6px 13px;font-weight:600;font-size:12.5px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#33436F;color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.ghost-crit{color:var(--crit);border-color:#E4C4BB}
.btn.sm{padding:4px 10px;font-size:12px}

.note{background:var(--assum-soft);border:1px solid #DDD4EF;border-radius:10px;padding:10px 14px;font-size:12.5px;color:#4A3F73;margin-bottom:16px}
.note b{font-weight:700}

/* proposal cards */
.props{display:grid;gap:10px}
.prop{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:8px}
.prop .why{font-size:12.5px;color:var(--muted);margin-top:4px;max-width:75ch}
.prop .acts{display:flex;gap:8px;align-items:flex-start}
.prop .val{font-family:var(--mono);font-size:12px;color:var(--ink);background:var(--ground);border-radius:6px;padding:2px 8px;margin-left:8px}
.prop.decided{opacity:.62}

/* TNA */
.tna{display:flex;gap:4px;align-items:center}
.tna i{width:22px;height:8px;border-radius:4px;background:#E3E1DB}
.tna i.d{background:var(--ok)} .tna i.due{background:var(--warn)} .tna i.slip{background:var(--crit)}

/* timeline (samples) */
.vtl{padding:14px 18px}
.vrow{display:flex;gap:14px;padding:10px 0;border-bottom:1px dashed var(--line)}
.vrow:last-child{border-bottom:none}
.vtag{font-family:var(--mono);font-weight:600;font-size:12px;background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:3px 8px;height:fit-content;white-space:nowrap}
.vtag.ok{background:var(--ok-soft);color:var(--ok)}

/* store app phone */
.phonewrap{display:flex;gap:26px;align-items:flex-start;flex-wrap:wrap}
.phone{width:340px;background:var(--card);border:1px solid var(--line);border-radius:26px;padding:14px;box-shadow:0 12px 32px rgba(28,33,40,.10);flex-shrink:0}
.phone .ph-head{display:flex;align-items:center;gap:8px;padding:6px 8px 12px}
.phone .ph-head b{font-size:14px}
.ph-body{background:var(--ground);border-radius:16px;padding:14px;min-height:420px}
.ph-step h3{font-size:13.5px;font-weight:700;margin-bottom:8px}
.ph-item{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:12.5px}
.ph-item b{display:block;font-size:12.5px}
.ph-btn{display:block;width:100%;text-align:center;background:var(--accent);color:#fff;font-weight:600;border-radius:10px;padding:10px;margin-top:10px}
.ph-btn.ghost{background:var(--card);color:var(--accent);border:1px solid var(--accent)}
.scanbox{border:2px dashed #B9C0CF;border-radius:12px;height:110px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;background:repeating-linear-gradient(45deg,#FDFDFC,#FDFDFC 8px,#F4F3EF 8px,#F4F3EF 16px)}
.avail{display:flex;justify-content:space-between;align-items:center;font-size:12px;padding:6px 2px}
.avail b{font-variant-numeric:tabular-nums}

/* toast */
.toast{position:fixed;bottom:22px;right:22px;background:var(--rail);color:#fff;border-radius:10px;padding:11px 16px;font-size:13px;box-shadow:0 10px 26px rgba(0,0,0,.25);opacity:0;transform:translateY(8px);transition:.25s;z-index:60;max-width:340px}
.toast.show{opacity:1;transform:none}

/* matrix */
.mx td,.mx th{text-align:center;padding:7px 8px}
.mx td:first-child,.mx th:first-child{text-align:left;font-weight:600}
.mx .rw{color:var(--ok);font-weight:700}.mx .ro{color:var(--muted)}.mx .na{color:#C9C6BF}.mx .ap{color:var(--accent);font-weight:700}

/* feed */
.feed{list-style:none;padding:6px 0}
.feed li{display:flex;gap:12px;padding:8px 16px;border-bottom:1px solid #EFEDE8;font-size:12.5px;align-items:baseline}
.feed li:last-child{border-bottom:none}
.feed .t{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap;width:58px}
.feed .dir{font-size:10px;font-weight:700;letter-spacing:.06em;border-radius:4px;padding:1px 6px}
.feed .in{background:var(--ok-soft);color:var(--ok)} .feed .out{background:var(--accent-soft);color:var(--accent)}

.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:1100px){.two{grid-template-columns:1fr}}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.mini{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:12.5px}
.mini h4{font-size:12px;font-weight:700;margin-bottom:6px}
.mini .row{display:flex;justify-content:space-between;padding:3px 0;color:var(--muted)}
.mini .row b{color:var(--ink);font-variant-numeric:tabular-nums}
.footer-note{font-size:11.5px;color:var(--muted);margin-top:26px;border-top:1px solid var(--line);padding-top:10px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>

<div class="app">
  <div class="topbar">
    <div class="brand"><b>BSC Ops Core</b></div>
    <div class="portals" id="portals"></div>
    <div class="pills">
      <div class="pill" id="pillEnigma"><span class="dot"></span>Enigma · synced 4 min ago</div>
      <div class="pill"><span class="dot amber"></span>Shopify · daily 02:00</div>
    </div>
  </div>
  <div class="main">
    <nav class="rail" id="rail"></nav>
    <div class="content" id="content"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ================= ASSUMPTIONS (mirror of the register sheet) ================= */
const ASSUM = {
 "A-01":"New code grammar (CTN-PPL-0412) is go-forward; legacy codes become aliases.",
 "A-02":"One canonical store list (~30); file variants become aliases.",
 "A-03":"Incomplete mandatory fields block channel go-live (hard gate).",
 "A-04":"Healthy = coverage ≥ 2 lead times AND ≥80% size availability.",
 "A-05":"ROS computed on in-stock weeks only, per size and store.",
 "A-06":"Coverage alert fires one lead time + 1 week before stock-out.",
 "A-07":"Lost sales captured at counter in 2 taps, counted into demand.",
 "A-08":"Promote-to-core proposed at ≥1.5× category-median ROS over 4 in-stock weeks.",
 "A-09":"Liquidation proposed at 120 days age or <40% size completeness.",
 "A-10":"Default block window 60 days where vendor window unknown.",
 "A-11":"One threshold field lives here, pushed to Enigma.",
 "A-12":"Fabric intake form replaces the ordering sheet; one approval before PO.",
 "A-13":"Mill availability ingested daily; option auto-hides at zero.",
 "A-14":"Availability-only mills: orders above 25 m need manual confirmation.",
 "A-15":"Trims & packaging on one vendor master; Sourcing procures, factory consumes via job cards.",
 "A-16":"Samples in versioned rounds; factory sees only latest approved.",
 "A-17":"Consumption rule needs a second-person check before activation.",
 "A-18":"Category / sub / colour / fit come from controlled lists.",
 "A-19":"Marketing self-serves name, description, images 15 days pre-launch.",
 "A-20":"Six TNA milestones per PO: fabric in-house, cutting, stitching, QC, dispatch, GRN.",
 "A-21":"Vendors confirm dates in a thin portal; fallback = entered from email.",
 "A-22":"RAS above ₹2,00,000 delta needs finance re-approval.",
 "A-23":"QC as per-batch checklist with photos (later slice).",
 "A-24":"Barcode on every piece, QR on every swatch sticker; scans at 4 nodes.",
 "A-25":"STO closes on receiving scan; unscanned 48 h raises an alert.",
 "A-26":"Hemming in/out scans; dwell >5 days flags.",
 "A-27":"Damage is scanned out on the floor; leaves sale instantly.",
 "A-28":"Swatch dispatches need receipt confirmation within 72 h.",
 "A-29":"Stores see live saleable = physical − reserved − threshold, read from Enigma.",
 "A-30":"One order entry flows to Shopify (billing) and Enigma (production).",
 "A-31":"Tailor adjustment beyond ±2\" or pattern-match fabric triggers consumption recheck.",
 "A-32":"Returns are status cases: store → factory → resolution, visible end to end.",
 "A-33":"Cost/SKU = fabric + making + shipping + hemming + trims on the record.",
 "A-34":"Working capital computed from live PO ledger incl. PDC dates.",
 "A-35":"Commitments above ₹5,00,000 require budget-fit approval.",
 "A-36":"Order qty per option taken from PO quantities → sell-through computable.",
 "A-37":"Enigma read every 15 minutes via API (THE open gate — due Call 5).",
 "A-38":"Identity pushed Ops Core → Enigma → Shopify; Enigma stays the channel gate.",
 "A-39":"Shopify sales read daily as the demand signal.",
 "A-40":"Eight roles with the drafted rights matrix.",
 "A-41":"MTM fabric is replenishable stock (metres, threshold, coverage). RTW fabric is bought per production run and consumed — no threshold, no reorder.",
 "A-42":"The spines share only the fabric code, the vendor/store masters and the launch calendar — NOT a stock pool.",
 "A-43":"MTM is measured in metres, RTW in pieces (one discovery note says the opposite — please settle it)."
};

/* ================= NAV ================= */
const NAV = [
 {id:"cockpit", label:"Cockpit", solo:true},
 {id:"spines", label:"How the two spines split", solo:true},
 {id:"proposals", label:"Proposal Queue", solo:true},

 {sec:"MTM", note:"Fabric is the product · metres", cls:"mtm", groups:[
   {id:"mtm_m", label:"Masters", kids:[["mtm_master","Fabric Master"],["fab360","Fabric 360 · drill-down"],["mtm_custom","Customisation & Consumption"]]},
   {id:"mtm_s", label:"Sourcing", kids:[["mtm_intake","Material Intake"],["mtm_blocks","Block Register"],["mtm_mills","Bespoke Mill Feeds"]]},
   {id:"mtm_p", label:"Planning", kids:[["mtm_repl","Replenishment · metres"]]},
   {id:"mtm_o", label:"Operations", kids:[["mtm_swatch","Swatch Books & Displays"]]},
 ]},

 {sec:"RTW", note:"Garment × size is the product · pieces", cls:"rtw", groups:[
   {id:"rtw_m", label:"Masters", kids:[["rtw_style","Style Master"],["style360","Style 360 · drill-down"]]},
   {id:"rtw_p", label:"Planning", kids:[["rtw_drops","Drops & Collections"],["rtw_plan","Option Plan & Slots"],["rtw_repl","Replenishment · pieces"],["rtw_sizes","Size Ratios"],["rtw_life","Non-core Lifecycle"]]},
   {id:"rtw_pp", label:"Pre-production", kids:[["rtw_bom","BOM · fabric & trims per run"],["rtw_sample","Sampling Rounds"],["rtw_tna","PO Board · TNA & RAS"],["rtw_qc","QC & Vendor Score"]]},
 ]},

 {sec:"SHARED", note:"Used by both spines", cls:"sh", groups:[
   {id:"sh_m", label:"Masters", kids:[["m_vendors","Vendors & Mills"],["m_stores","Stores"],["m_trims","Trims & Packaging"],["m_naming","Naming & Aliases"]]},
   {id:"sh_o", label:"Operations", kids:[["l_inward","Goods Inward"],["l_hemming","Hemming Tracker"],["l_sto","Allocation & STOs"],["l_pullback","Pull-backs"],["returns","Returns & Service"],["lost","Lost Sales"]]},
   {id:"sh_f", label:"Finance", kids:[["f_cogs","Cost per SKU"],["f_margin","Margin Working"],["f_wc","Working Capital"],["f_budget","Budget-Fit Approvals"]]},
   {id:"sh_i", label:"Intelligence", kids:[["i_health","Option Health"],["i_sell","Sell-through"],["i_age","Ageing & Liquidation"],["i_feedback","Store Feedback"]]},
   {id:"sh_x", label:"Integrations", kids:[["x_enigma","Enigma Sync"],["x_shopify","Shopify Sync"],["x_writer","One Writer per Field"]]},
   {id:"sh_a", label:"Admin", kids:[["a_models","Business Models"],["a_roles","Roles & Permissions"],["a_rules","Rules & Thresholds"],["a_audit","Audit Log"]]},
 ]},
];
const PORTALS = [["ops","Ops Core"],["store","Store App"],["vendor","Vendor & Mill Portal"]];

/* ================= HELPERS ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
const chip = id => `<span class="chip" title="${esc(ASSUM[id]||"")}">${id}</span>`;
const badge = (t,k) => `<span class="badge b-${k}">${t}</span>`;
let toastT;
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),2600); }
function vhead(crumb,h,p,sp){
 const tag = sp==="mtm"?'<div><span class="spine sp-mtm">MTM SPINE · METRES</span></div>'
   : sp==="rtw"?'<div><span class="spine sp-rtw">RTW SPINE · PIECES</span></div>'
   : sp==="both"?'<div><span class="spine sp-both">SHARED BY BOTH SPINES</span></div>':'';
 return `<div class="vhead">${tag}<div class="crumb">${crumb}</div><h1>${h}</h1>${p?`<p>${p}</p>`:""}</div>`; }
function card(title, inner, right=""){ return `<div class="card"><div class="chead"><h2>${title}</h2><div class="right">${right}</div></div>${inner}</div>`; }
function tbl(cols, rows){ return `<div class="tblwrap"><table><thead><tr>${cols.map(c=>`<th class="${c.num?'num':''}">${c.h}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((c,i)=>`<td class="${cols[i]&&cols[i].num?'num':''}">${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`; }

function excludedCount(f){ return f.weeks.filter(w=>!w[3]).length; }
let fabSel = "CTN-PPL-0412", fabQuery = "";
function fabPick(c){ fabSel=c; fabQuery=""; render(); }
function fabSearch(v){ fabQuery=v; const l=document.getElementById("fabResults"); if(l) l.innerHTML = fabList(); }
function fabList(){
 const q = fabQuery.trim().toLowerCase();
 const hits = Object.entries(FABRICS).filter(([c,f]) => !q || c.toLowerCase().includes(q) || f.name.toLowerCase().includes(q) || f.bucket.toLowerCase().includes(q) || f.vendor.toLowerCase().includes(q));
 if(!hits.length) return `<div style="padding:10px 14px;color:var(--muted);font-size:12.5px">No fabric matches “${esc(fabQuery)}”. Try a code, a name, a bucket, or a vendor.</div>`;
 return hits.map(([c,f])=>`<button class="fabopt ${c===fabSel?'on':''}" onclick="fabPick('${c}')"><span class="code">${c}</span><span>${f.name}</span><span class="badge b-mut">${f.bucket}</span><span style="color:var(--muted);font-size:11.5px">${f.vendor}</span></button>`).join("");
}
V.fab360 = () => {
 const f = FABRICS[fabSel];
 const bespoke = f.physical === null;
 const saleable = bespoke ? null : f.physical - f.reserved - f.threshold;
 const counted = f.weeks.filter(w=>w[3]);
 const last4 = counted.slice(-4).map(w=>w[2]);
 const ros = last4.reduce((a,b)=>a+b,0)/last4.length;
 const naive = f.weeks.reduce((a,b)=>a+b[2],0)/f.weeks.length;
 const understate = ros>0 ? Math.round((ros-naive)/ros*100) : 0;
 const showDiff = excludedCount(f) > 0 && Math.round(ros) !== Math.round(naive) && understate >= 5;
 const cover = (!bespoke && ros>0) ? saleable/(ros/7) : null;
 const trigger = f.lead ? f.lead + 7 : null;
 const fires = cover!==null && trigger!==null && cover < trigger;
 const need = fires ? Math.ceil((ros*trigger/7 + f.threshold - saleable - f.onOrder)/f.roll)*f.roll : 0;
 const excluded = f.weeks.length - counted.length;

 const search = `<div class="fabsearch">
   <input id="fabInput" type="search" placeholder="Search any fabric — code, name, bucket or vendor" value="${esc(fabQuery)}" oninput="fabSearch(this.value)" autocomplete="off">
   <div class="fabres" id="fabResults">${fabList()}</div>
   <div class="fabhint">Showing ${Object.keys(FABRICS).length} of ~4,000 fabrics</div>
 </div>`;

 const kpis = bespoke
  ? `<div class="kpis">
      <div class="kpi crit"><b>0 m</b><span>BSC holds no stock — mill stock only</span></div>
      <div class="kpi"><b>${ros.toFixed(0)} m</b><span>avg weekly cut length ${chip("A-05")}</span></div>
      <div class="kpi crit"><b>Hidden</b><span>mill reported sold out ${chip("A-13")}</span></div>
      <div class="kpi"><b>Feed</b><span>availability only, no quantity ${chip("A-14")}</span></div>
     </div>`
  : `<div class="kpis">
      <div class="kpi"><b>${saleable} m</b><span>saleable now ${chip("A-29")}</span></div>
      <div class="kpi"><b>${ros.toFixed(0)} m</b><span>true ROS / week ${chip("A-05")}</span></div>
      <div class="kpi ${fires?'crit':'ok'}"><b>${Math.round(cover)} d</b><span>cover · lead time ${f.lead} d</span></div>
      <div class="kpi ${fires?'warn':''}"><b>${fires? need+" m" : "—"}</b><span>${fires?"proposed reorder":"no action needed"}</span></div>
     </div>`;

 const stock = bespoke

     ["BSC-owned stock","none — cut length service",badge("by design","mut")],
     ["Mill availability",badge(f.millState,"crit"),badge("Vendor Portal","mut")+chip("A-13")],
     ["Channel state",badge("Hidden on web + stores","crit"),badge("automatic","ok")]]))
  : card("Live stock — read, never typed", tbl([{h:"Component"},{h:"Metres",num:1},{h:"Source"}],[
     ["Physical in warehouse",String(f.physical),badge("Enigma","ok")],
     ["Less: reserved against orders","− "+f.reserved,badge("Enigma","ok")],
     ["Less: threshold cushion","− "+f.threshold,badge("Ops Core → Enigma","acc")+chip("A-11")],
     ["<b>Saleable</b>","<b>"+saleable+"</b>",badge("computed","mut")]]),
     `<span style="font-size:11.5px;color:var(--muted)">Enigma read 10:42</span>`);

 const coverCard = bespoke
  ? card("Why there is no reorder maths here", `<div style="padding:14px 16px;font-size:13px;color:var(--muted)">
      Bespoke fabric is never bought ahead — the mill cuts what each order needs. So there is no threshold, no cover, and no reorder.
      The only thing that matters is whether the mill still has it, and that is why the channel gate follows the mill feed automatically.</div>`)
  : card("Cover & reorder — the full working", `<div style="padding:14px 16px;display:grid;gap:7px;font-size:13px">

      ${fires?`<div style="border-top:1px dashed var(--line);padding-top:7px">Cover ${trigger} days: ${(trigger/7).toFixed(0)} weeks × ${ros.toFixed(0)} = <b>${Math.round(ros*trigger/7)} m</b></div>
      <div>Rebuild the threshold cushion: + <b>${f.threshold} m</b> → target <b>${Math.round(ros*trigger/7)+f.threshold} m</b></div>
      <div>Less saleable: − ${saleable} m · Less already on order: − ${f.onOrder} m → shortfall <b>${Math.round(ros*trigger/7)+f.threshold-saleable-f.onOrder} m</b></div>
      <div>Rounded up to ${f.vendor}'s ${f.roll} m rolls = <b style="color:var(--accent)">${need} m proposed</b></div>`
      :`<div style="border-top:1px dashed var(--line);padding-top:7px;color:var(--muted)">Nothing to order. The system will keep watching and raise a proposal the day cover crosses ${trigger} days.</div>`}
     </div>`, fires?`<button class="btn primary sm" onclick="go('proposals')">See it in the queue</button>`:"");

 return vhead("MTM Fabric · Fabric 360", fabSel + " · " + f.name,
   "One fabric, every number in one place — identity, live stock, demand, cover, orders in flight, and every decision ever taken on it.")
  + search + kpis + V.two(
   card("Identity", tbl([{h:"Field"},{h:"Value"},{h:"Written by"}],[
    ["Fabric code",`<span class="code">${fabSel}</span>`,badge("Ops Core","acc")],

    ["Bucket",f.bucket,badge("Ops Core","acc")],
    ["Vendor",f.vendor + (f.lead?` · lead ${f.lead} d · ${f.roll} m rolls`:" · cut length"),badge("Ops Core","acc")],
    ["Consumption",f.consumption+" "+chip("A-31"),badge("Ops Core","acc")]])),
   stock)
  + card(`Demand — ${showDiff?`why the ROS is ${ros.toFixed(0)} m, not ${naive.toFixed(0)} m`:(excluded?"eight weeks, one excluded":"eight weeks, all countable")}`,
    tbl([{h:"Week"},{h:"Stock condition"},{h:"Metres used",num:1},{h:"Counted?"}],
     f.weeks.map(w=>[w[0], w[3]?w[1]:`<span style="color:var(--crit)">${w[1]}</span>`, String(w[2]),
      w[3]?badge("counted","ok"):badge("excluded — stock was out","crit")+chip("A-05")]))
    + `<div style="padding:12px 16px;border-top:1px solid var(--line);display:grid;gap:6px;font-size:13px">
       <div><b>Our method</b> — last 4 in-stock weeks: (${last4.join(" + ")}) ÷ 4 = <b>${ros.toFixed(0)} m / week</b></div>
       ${showDiff?`<div style="color:var(--crit)"><b>Today's method</b> — all ${f.weeks.length} weeks including the ${excluded} sold-out one${excluded>1?"s":""}: ${f.weeks.reduce((a,b)=>a+b[2],0).toLocaleString()} ÷ ${f.weeks.length} = <b>${naive.toFixed(0)} m / week</b></div>
       <div style="color:var(--muted)">Counting the sold-out weeks understates real demand by <b>${understate}%</b> — which is how a fabric that sells fine ends up under-ordered, runs out again, and looks weaker still.</div>`
       :`<div style="color:var(--muted)">${excluded? "The one excluded week is too recent to shift the average yet — but it is excluded on principle, so the number never drifts downward as stock-outs accumulate." : `This fabric has not been out of stock in the last ${f.weeks.length} weeks, so both methods agree. The difference only appears once a stock-out happens.`}</div>`}
      </div>`)
  + coverCard
  + V.two(
    card("Orders in flight", tbl([{h:"PO"},{h:"Qty",num:1},{h:"Expected"},{h:"State"}],
     f.pos.map(p=>[p[0]==="—"?"— none open":`<span class="code">${p[0]}</span>`,p[1],p[2],badge(p[3],p[4])]))),
    card("Where this fabric lives", tbl([{h:"Presence"},{h:"Detail"}], f.presence.map(x=>[x[0],x[1]]))))
  + card("Decision history — the memory that used to live in someone's head",
     tbl([{h:"When"},{h:"Who"},{h:"Decision"},{h:"Reason given"}], f.decisions.map(d=>[d[0],d[1],d[2],d[3]])));
};

 "This is where RTW fabric lives — as a line on one production run, against its PO, consumed and closed. It is never a replenished stock item.", "rtw") +
 `<div class="note"><b>Fabric here is an input, not stock.</b> Bought against a PO, sent to the factory, cut into garments, closed. No threshold, no coverage, no reorder — that behaviour belongs to MTM. ${chip("A-41")}</div>` +
 card("BOM · RTW-SHT-027 Flannel Overshirt · run of 900 pc", tbl(
  [{h:"Line"},{h:"Item"},{h:"Qty for this run",num:1},{h:"Source mode"},{h:"PO"},{h:"State"}],
  [
   ["Fabric",`<span class="code">FLN-MOS-0512</span> Moss Flannel`,"1,980 m","brand-supplied",`<span class="code">PO-2210</span>`,badge("Loom start confirmed","ok")],
   ["Trims","Buttons · MOP 18L","10,800 pc","factory pre-sources",`<span class="code">PO-2211</span>`,badge("Ordered","ok")],
   ["Trims","Interlining · soft","900 m","brand-supplied",`<span class="code">PO-2211</span>`,badge("Reorder proposed","warn")],
   ["Packaging","Garment covers","900 pc","brand-supplied","—",badge("From stock","ok")],
  ]), `<span style="font-size:12px;color:var(--muted)">Consumption 2.10 m + 10% flannel brush</span>`) +
 card("Tech pack for this run", tbl([{h:"Version"},{h:"BOM lines",num:1},{h:"Shared with"},{h:"State"}],[
  ["TP-v3","14","Tirupur factory · trims vendor",badge("Current","ok")],
  ["TP-v2","14","Tirupur factory",badge("Superseded","mut")]]));

/* ---------- Style 360 · RTW drill-down ---------- */
const STYLES = {
 "RTW-SHT-021":{name:"Oxford Button-Down · White",cat:"RTW Shirts · Standard",fabric:"CTN-OXF-0301",mrp:3900,cogs:1183,
  launched:"02 May 26",bucket:"Core",vendor:"Tirupur factory",lead:21,
  sizes:[["S",96,14,1],["M",44,28,0],["L",38,31,0],["XL",71,19,1],["XXL",58,11,1]],
  ordered:1400, sold:1042},
 "RTW-CHN-009":{name:"Chino · Sand",cat:"RTW Bottoms · Slim",fabric:"TWL-CHN-0455",mrp:4500,cogs:1417,
  launched:"14 Mar 26",bucket:"Non-core → promote proposed",vendor:"Bengaluru factory",lead:30,
  sizes:[["30",64,9,1],["32",81,12,1],["34",77,11,1],["36",52,8,1]],
  ordered:900, sold:612},
 "RTW-SHT-014":{name:"Cuban Collar Print",cat:"RTW Shirts · Relaxed",fabric:"VSC-PRT-0209",mrp:3400,cogs:1141,
  launched:"09 May 26",bucket:"Non-core · liquidation proposed",vendor:"Tirupur factory",lead:21,
  sizes:[["XS",102,0.4,1],["S",0,0,0],["M",0,0,0],["L",0,0,0],["XXL",88,0.6,1]],
  ordered:600, sold:410},
};
let styleSel="RTW-SHT-021";
function stylePick(c){ styleSel=c; render(); }
V.style360 = () => {
 const st = STYLES[styleSel];
 const totalPc = st.sizes.reduce((a,s)=>a+s[1],0);
 const live = st.sizes.filter(s=>s[3]).length;
 const inStock = st.sizes.filter(s=>s[1]>0).length;
 const complete = Math.round(inStock/st.sizes.length*100);
 const sell = Math.round(st.sold/st.ordered*100);
 return vhead("RTW Pre-production", styleSel+" · "+st.name,
  "One style, every number in one place — and crucially, broken out per size, because that is the grain the business actually lives at.", "rtw") +
 `<div class="fabsearch"><div class="fabres">${Object.entries(STYLES).map(([c,x])=>
   `<button class="fabopt ${c===styleSel?'on':''}" onclick="stylePick('${c}')"><span class="code">${c}</span><span>${x.name}</span><span class="badge b-mut">${x.cat.split(" · ")[0]}</span><span style="color:var(--muted);font-size:11.5px">${x.bucket.split(" ")[0]}</span></button>`).join("")}</div>
  <div class="fabhint">Showing 3 of ~1,800 styles</div></div>` +
 `<div class="kpis">
   <div class="kpi"><b>${totalPc}</b><span>pieces in stock (all sizes)</span></div>
   <div class="kpi ${complete<60?'crit':complete<80?'warn':'ok'}"><b>${complete}%</b><span>size completeness ${chip("A-04")}</span></div>
   <div class="kpi ${sell<50?'warn':'ok'}"><b>${sell}%</b><span>sell-through ${chip("A-36")}</span></div>
   <div class="kpi"><b>₹${(st.mrp-st.cogs).toLocaleString()}</b><span>margin per piece</span></div>
  </div>` +
 card("Stock and demand — per size, not per style", tbl(
  [{h:"Size"},{h:"Pieces",num:1},{h:"True ROS/wk",num:1},{h:"Cover",num:1},{h:"State"}],
  st.sizes.map(sz=>{
   const cover = sz[2]>0 ? Math.round(sz[1]/(sz[2]/7)) : null;
   const fires = cover!==null && cover < st.lead+7;
   const clean = sz[3];
   const st2 = sz[1]===0 ? badge("SIZE OUT — nothing to sell","crit")
     : fires ? badge("Reorder proposed","warn") : badge("Healthy","ok");
   return [sz[0], String(sz[1]), sz[2]?sz[2].toString():"—",
    cover!==null?cover+" d":"—",
    st2 + (clean?"":' <span class="sub2" style="display:inline;color:var(--crit)">3 of 8 weeks excluded — was out of stock</span>'+chip("A-05"))];
  })),
  `<span style="font-size:12px;color:var(--muted)">Lead time ${st.lead} d · trigger at ${st.lead+7} d</span>`) +
 `<div class="note">${live<st.sizes.length
   ? `<b>${st.sizes.length-live} of ${st.sizes.length} sizes have been out of stock recently</b>, so their weeks are excluded from the ROS. Read at style level this looks like a weak seller; read per size it is a strong style that was starved — the exact failure the record calls “a working style quietly dies”. ${chip("A-05")}`
   : `Every size has been continuously in stock, so the style-level number and the per-size numbers agree. The gap only opens once a size breaks.`}</div>` +
 V.two(
  card("Identity", tbl([{h:"Field"},{h:"Value"}],[
   ["Design code",`<span class="code">${styleSel}</span>`],["Category / fit",st.cat],["Bucket",st.bucket],
   ["Fabric used in the run",`<span class="code">${st.fabric}</span> — consumed, not stocked `+chip("A-41")],
   ["Launched",st.launched],["Made by",st.vendor+" · lead "+st.lead+" d"]])),
  card("Commercials", tbl([{h:"Field"},{h:"Value",num:1}],[
   ["MRP","₹"+st.mrp.toLocaleString()],["COGS","₹"+st.cogs.toLocaleString()],
   ["Margin per piece","₹"+(st.mrp-st.cogs).toLocaleString()],
   ["Ordered (this drop)",st.ordered+" pc"],["Sold to date",st.sold+" pc"],
   ["Sell-through",sell+"%"]]))) +
 card("Decision history", tbl([{h:"When"},{h:"Who"},{h:"Decision"},{h:"Reason"}],[
  ["today 10:41","system","Reorder proposed for sizes M and L","cover below trigger on both"],
  ["12 Aug","Planner","No action at style level","style ROS looked weak — we now know why"],
  [st.launched,"Design","Launched on all channels","mandatory fields complete"]]));
};

 "In MTM the customer buys a fabric, then chooses how it is made. This master holds those choices — and the metres each one costs. Every order in the business converts to cloth through the rules on this page.", "mtm") +
 card("The exchange rate — one order into metres", `<div style="padding:14px 16px">
   <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;margin-bottom:12px">
    <span class="badge b-acc" style="font-size:12px">Customer picks fabric + fit + collar + cuff</span><span style="color:var(--muted)">→</span>
    <span class="badge b-mut" style="font-size:12px">Fit Smart · 5 questions</span><span style="color:var(--muted)">→</span>
    <span class="badge b-warn" style="font-size:12px">consumption rule on this page</span><span style="color:var(--muted)">→</span>

   </div>

    <div>Base for Standard fit = <b>1.60 m</b></div>
    <div>Fabric is a stripe, so the pattern-match uplift applies: 1.60 × 1.08 = <b>1.73 m</b> ${chip("A-31")}</div>
    <div>Tailor let out the sleeve 1.5 in — inside the ±2 in tolerance, so no recheck: stays <b>1.73 m</b></div>

   </div></div>`) +
 card("Consumption rules", tbl(

   ["Shirt · Slim fit","1.55 m","+8% checks & stripes","Tech + Design",badge("Active","ok")],
   ["Shirt · Relaxed fit","1.75 m","+8% checks & stripes","Tech + Design",badge("Active","ok")],
   ["Overshirt","2.10 m","+10% flannel brush","pending "+chip("A-17"),badge("Blocked from go-live","warn")],

 card("Customisation options in the catalogue", tbl(
  [{h:"Option"},{h:"Type"},{h:"Metre effect"},{h:"Sampled on"},{h:"State"}],
  [
   [`<span class="code">MTM-OPT-1101</span> 1-button cuff`,"Cuff","none","all fabrics",badge("Live","ok")],
   [`<span class="code">MTM-OPT-1104</span> Cutaway collar`,"Collar","none","core fabrics",badge("Live","ok")],
   [`<span class="code">MTM-OPT-1107</span> Contrast inner collar`,"Collar","+0.10 m","poplin, oxford",badge("Live","ok")],
   [`<span class="code">MTM-OPT-1109</span> Placket stiffener`,"Placket","none","linen + poplin",badge("V2 comments due","warn")],
  ])) +
 card("What breaks downstream if a rule here is wrong", tbl(
  [{h:"If the rule is…"},{h:"What happens to stock"},{h:"What happens to planning"}],
  [
   ["too low","Cutting needs more cloth than was reserved. The shortfall is found at the table, mid-order.","ROS understates real usage, so coverage looks healthier than it is and the reorder fires late."],

   ["missing an uplift","Every checked or striped order quietly under-reserves.","The error compounds across hundreds of orders before anyone notices."],

 `<div class="note">This is why an option cannot go live until a second person has checked its rule. The Overshirt above is blocked for exactly that reason. ${chip("A-17")}</div>`;

/* ================= SHELL / ROUTER ================= */
let portal="ops", view="cockpit";
function go(v){ view=v; if(["storeapp"].includes(v)) portal="store"; render(); const m=findMod(v); if(m) openMod=m; buildRail(); }
function findMod(v){ for(const n of NAV){ if(n.groups) for(const g of n.groups){ if(g.kids.some(k=>k[0]===v)) return g.id; } } return null; }
let openMod="cockpit";
function buildRail(){
 const r=$("#rail");
 if(portal!=="ops"){
  r.innerHTML=`<div class="sec sh"><div class="sechead">PORTAL</div><div class="mod open"><button class="lvl2" style="color:#fff">${portal==="store"?"Store App":"Vendor & Mill Portal"}</button></div></div>
   <div class="sec sh"><div class="sechead">SWITCH BACK</div><div class="mod"><button class="lvl2" onclick="setPortal('ops')">← Ops Core</button></div></div>`;
  return;
 }
 r.innerHTML = NAV.map(n=>{
  if(n.solo) return `<div class="mod"><button class="lvl1 ${view===n.id?"on1":""}" onclick="go('${n.id}')">${n.label}</button></div>`;
  return `<div class="sec ${n.cls}"><div class="sechead">${n.sec}<span>${n.note}</span></div>` +
   n.groups.map(g=>{
    const open = openMod===g.id || g.kids.some(k=>k[0]===view);
    return `<div class="mod ${open?"open":""}"><button class="lvl2" onclick="tog('${g.id}')">${g.label}<span class="chev">▶</span></button>
      <div class="sub">${g.kids.map(k=>`<button class="${view===k[0]?"on":""}" onclick="go('${k[0]}')">${k[1]}</button>`).join("")}</div></div>`;
   }).join("") + `</div>`;
 }).join("");
}
function tog(id){ openMod = openMod===id? null : id; buildRail(); }
function setPortal(p){ portal=p; view = p==="ops"?"cockpit": p==="store"?"storeapp":"vendorportal"; buildPortals(); buildRail(); render(); }
function buildPortals(){ $("#portals").innerHTML = PORTALS.map(([id,l])=>`<button class="${portal===id?"on":""}" onclick="setPortal('${id}')">${l}</button>`).join(""); }
function render(){
 const v = portal==="store"?"storeapp": portal==="vendor"?"vendorportal": view;
 $("#content").innerHTML = (V[v]||V.cockpit)() + `<div class="footer-note">BSC Ops Core · DevX Labs × Bombay Shirt Company</div>`;
 $("#content").scrollTop=0;
}
buildPortals(); buildRail(); render();

</script>
