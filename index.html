<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BSC Ops Core</title>
<title>BSC Ops Core</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --ground:#F6F5F2; --card:#FFFFFF; --ink:#1C2128; --muted:#5C6470; --line:#E3E1DB;
  --rail:#232B3A; --rail-ink:#B9C0CF; --rail-active:#FFFFFF; --rail-hi:#2E3950;
  --accent:#3E4F82; --accent-soft:#E8EBF4;
  --ok:#2E7D5B; --ok-soft:#E2F0E9; --warn:#B07818; --warn-soft:#F7EDD8; --crit:#B3432B; --crit-soft:#F6E2DC;
  --assum:#6B5CA5; --assum-soft:#EDE9F6;
  --mono:'JetBrains Mono',ui-monospace,monospace; --ui:'Archivo',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--ui);background:var(--ground);color:var(--ink);font-size:14px;line-height:1.45}
button{font-family:var(--ui);cursor:pointer;border:none;background:none;font-size:13px}
.app{display:flex;flex-direction:column;height:100vh;overflow:hidden}

/* ---------- top bar ---------- */
.topbar{display:flex;align-items:center;gap:16px;height:52px;padding:0 16px;background:var(--card);border-bottom:1px solid var(--line);flex-shrink:0}
.brand{display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.brand b{font-size:15px;font-weight:700;letter-spacing:.01em}
.brand span{font-size:10px;font-weight:600;letter-spacing:.09em;color:var(--assum);border:1px solid var(--assum);border-radius:3px;padding:1px 5px}
.portals{display:flex;gap:2px;background:var(--ground);border:1px solid var(--line);border-radius:8px;padding:3px}
.portals button{padding:5px 12px;border-radius:6px;font-weight:600;color:var(--muted)}
.portals button.on{background:var(--rail);color:#fff}
.pills{display:flex;gap:8px;margin-left:auto;align-items:center}
.pill{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--muted);background:var(--ground);border:1px solid var(--line);border-radius:20px;padding:4px 11px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.dot.amber{background:var(--warn)}
.assum-toggle{font-weight:600;color:var(--assum);background:var(--assum-soft);border:1px solid #D6CEEB;border-radius:20px;padding:4px 12px}
.assum-toggle.on{background:var(--assum);color:#fff}

/* ---------- layout ---------- */
.main{display:flex;flex:1;min-height:0}
.rail{width:236px;background:var(--rail);color:var(--rail-ink);overflow-y:auto;flex-shrink:0;padding:10px 0 30px}
.rail::-webkit-scrollbar{width:0}
.mod>button{display:flex;align-items:center;width:100%;padding:9px 16px;color:var(--rail-ink);font-weight:600;font-size:13px;text-align:left;gap:8px}
.mod>button:hover{color:#fff}
.mod .chev{margin-left:auto;transition:transform .15s;font-size:10px;opacity:.6}
.mod.open .chev{transform:rotate(90deg)}
.sub{display:none;padding:2px 0 6px}
.mod.open .sub{display:block}
.sub button{display:block;width:100%;text-align:left;padding:6px 16px 6px 34px;color:var(--rail-ink);font-size:12.5px;border-left:2px solid transparent}
.sub button:hover{color:#fff}
.sub button.on{color:var(--rail-active);background:var(--rail-hi);border-left-color:#8FA3D9;font-weight:600}
.rail .grp{padding:14px 16px 4px;font-size:10px;font-weight:700;letter-spacing:.12em;color:#6E7A93}
.sec{margin-top:15px;position:relative}
.sec::before{content:"";position:absolute;left:8px;top:30px;bottom:6px;width:2px;border-radius:2px;background:#39435C}
.sec.mtm::before{background:#4C8494}
.sec.rtw::before{background:#9A6B36}
.sechead{padding:7px 16px 7px;font-size:10.5px;font-weight:800;letter-spacing:.11em;color:#6E7A93}
.sechead span{display:block;font-size:9.5px;font-weight:600;letter-spacing:.02em;text-transform:none;opacity:.62;margin-top:2px}
.sec.mtm .sechead{color:#7FC3D3}
.sec.rtw .sechead{color:#D9A468}
.mod>button.lvl1{font-size:13px}
.mod>button.lvl1.on1{color:#fff}
.mod>button.lvl2{padding:8px 16px 8px 22px;font-size:12.5px;font-weight:600}
.sec .sub button{padding-left:38px}

/* ---------- content ---------- */
.content{flex:1;overflow-y:auto;padding:22px 26px 60px}
.vhead{margin-bottom:16px}
.vhead h1{font-size:20px;font-weight:700;letter-spacing:-.01em}
.vhead p{color:var(--muted);font-size:13px;margin-top:3px;max-width:70ch}
.crumb{font-size:11px;font-weight:600;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;margin-bottom:4px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer}
.kpi:hover{border-color:var(--accent)}
.kpi b{display:block;font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted)}
.kpi.crit b{color:var(--crit)} .kpi.warn b{color:var(--warn)} .kpi.ok b{color:var(--ok)}

.card{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:16px;overflow:hidden}
.card .chead{display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid var(--line)}
.card .chead h2{font-size:14px;font-weight:700}
.card .chead .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.tblwrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:#FBFAF8}
td{padding:9px 14px;border-bottom:1px solid #EFEDE8;vertical-align:top}
tr:last-child td{border-bottom:none}
tr.rowlink:hover td{background:#F7F8FB;cursor:pointer}
td .sub2{display:block;font-size:11.5px;color:var(--muted);margin-top:1px}
.code{font-family:var(--mono);font-size:12px;font-weight:600}
.codelink{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--accent);border-bottom:1px dotted var(--accent);cursor:pointer}
.codelink:hover{background:var(--accent-soft)}
.fabsearch{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:16px}
.fabsearch input{width:100%;font-family:var(--ui);font-size:13.5px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--ground);color:var(--ink)}
.fabsearch input:focus{outline:2px solid var(--accent);outline-offset:1px;background:var(--card)}
.entry{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;padding:14px 16px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:11.5px;color:var(--muted);min-width:130px;flex:1}
.fld.wide{min-width:220px;flex:2}
.fld input,.fld select{font-family:var(--ui);font-size:13px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--ground);color:var(--ink)}
.fld input:focus,.fld select:focus{outline:2px solid var(--accent);outline-offset:1px;background:var(--card)}
.entry .btn{margin-bottom:1px}
.inlineth{display:inline-flex;gap:6px;align-items:center}
.inlineth input{width:64px;font-family:var(--ui);font-size:12.5px;padding:4px 6px;border:1px solid var(--accent);border-radius:6px;background:var(--card);color:var(--ink)}
.formnote{font-size:11.5px;color:var(--muted);padding:0 16px 12px}
.fabres{display:grid;gap:4px;margin-top:9px;max-height:196px;overflow-y:auto}
.fabopt{display:grid;grid-template-columns:150px 1fr 110px 120px;gap:10px;align-items:center;text-align:left;padding:7px 10px;border-radius:7px;border:1px solid transparent}
.fabopt:hover{background:var(--ground);border-color:var(--line)}
.fabopt.on{background:var(--accent-soft);border-color:var(--accent);font-weight:600}
.fabhint{font-size:11.5px;color:var(--muted);margin-top:8px}
.spine{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.09em;border-radius:4px;padding:2px 7px;margin-bottom:7px}
.sp-mtm{background:#E4EEF0;color:#1F6070}
.sp-rtw{background:#F2EAE2;color:#8A5A2B}
.sp-both{background:#EAEAF2;color:#4A4A6A}
.rail .grp.mtm{color:#7FC3D3}
.rail .grp.rtw{color:#D9A468}
@media(max-width:900px){.fabopt{grid-template-columns:1fr;gap:2px}}
.num{font-variant-numeric:tabular-nums;text-align:right}
th.num{text-align:right}

.badge{display:inline-block;font-size:11px;font-weight:600;border-radius:12px;padding:2px 9px;white-space:nowrap}
.b-ok{background:var(--ok-soft);color:var(--ok)} .b-warn{background:var(--warn-soft);color:var(--warn)}
.b-crit{background:var(--crit-soft);color:var(--crit)} .b-mut{background:#EEECE7;color:var(--muted)}
.b-acc{background:var(--accent-soft);color:var(--accent)}
.chip{display:inline-block;font-family:var(--mono);font-size:10px;font-weight:600;color:var(--assum);background:var(--assum-soft);border:1px dashed #C9BEE6;border-radius:4px;padding:1px 5px;margin-left:6px;cursor:help;vertical-align:1px}
body.hi-assum .chip{background:var(--assum);color:#fff;border-style:solid}

.btn{border-radius:7px;padding:6px 13px;font-weight:600;font-size:12.5px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#33436F;color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.ghost-crit{color:var(--crit);border-color:#E4C4BB}
.btn.sm{padding:4px 10px;font-size:12px}

.note{background:var(--assum-soft);border:1px solid #DDD4EF;border-radius:10px;padding:10px 14px;font-size:12.5px;color:#4A3F73;margin-bottom:16px}
.note b{font-weight:700}

/* proposal cards */
.props{display:grid;gap:10px}
.prop{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:8px}
.prop .why{font-size:12.5px;color:var(--muted);margin-top:4px;max-width:75ch}
.prop .acts{display:flex;gap:8px;align-items:flex-start}
.prop .val{font-family:var(--mono);font-size:12px;color:var(--ink);background:var(--ground);border-radius:6px;padding:2px 8px;margin-left:8px}
.prop.decided{opacity:.62}

/* TNA */
.tna{display:flex;gap:4px;align-items:center}
.tna i{width:22px;height:8px;border-radius:4px;background:#E3E1DB}
.tna i.d{background:var(--ok)} .tna i.due{background:var(--warn)} .tna i.slip{background:var(--crit)}

/* timeline (samples) */
.vtl{padding:14px 18px}
.vrow{display:flex;gap:14px;padding:10px 0;border-bottom:1px dashed var(--line)}
.vrow:last-child{border-bottom:none}
.vtag{font-family:var(--mono);font-weight:600;font-size:12px;background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:3px 8px;height:fit-content;white-space:nowrap}
.vtag.ok{background:var(--ok-soft);color:var(--ok)}

/* store app phone */
.phonewrap{display:flex;gap:26px;align-items:flex-start;flex-wrap:wrap}
.phone{width:340px;background:var(--card);border:1px solid var(--line);border-radius:26px;padding:14px;box-shadow:0 12px 32px rgba(28,33,40,.10);flex-shrink:0}
.phone .ph-head{display:flex;align-items:center;gap:8px;padding:6px 8px 12px}
.phone .ph-head b{font-size:14px}
.ph-body{background:var(--ground);border-radius:16px;padding:14px;min-height:420px}
.ph-step h3{font-size:13.5px;font-weight:700;margin-bottom:8px}
.ph-item{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:12.5px}
.ph-item b{display:block;font-size:12.5px}
.ph-btn{display:block;width:100%;text-align:center;background:var(--accent);color:#fff;font-weight:600;border-radius:10px;padding:10px;margin-top:10px}
.ph-btn.ghost{background:var(--card);color:var(--accent);border:1px solid var(--accent)}
.scanbox{border:2px dashed #B9C0CF;border-radius:12px;height:110px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;background:repeating-linear-gradient(45deg,#FDFDFC,#FDFDFC 8px,#F4F3EF 8px,#F4F3EF 16px)}
.avail{display:flex;justify-content:space-between;align-items:center;font-size:12px;padding:6px 2px}
.avail b{font-variant-numeric:tabular-nums}

/* toast */
.toast{position:fixed;bottom:22px;right:22px;background:var(--rail);color:#fff;border-radius:10px;padding:11px 16px;font-size:13px;box-shadow:0 10px 26px rgba(0,0,0,.25);opacity:0;transform:translateY(8px);transition:.25s;z-index:60;max-width:340px}
.toast.show{opacity:1;transform:none}

/* matrix */
.mx td,.mx th{text-align:center;padding:7px 8px}
.mx td:first-child,.mx th:first-child{text-align:left;font-weight:600}
.mx .rw{color:var(--ok);font-weight:700}.mx .ro{color:var(--muted)}.mx .na{color:#C9C6BF}.mx .ap{color:var(--accent);font-weight:700}

/* feed */
.feed{list-style:none;padding:6px 0}
.feed li{display:flex;gap:12px;padding:8px 16px;border-bottom:1px solid #EFEDE8;font-size:12.5px;align-items:baseline}
.feed li:last-child{border-bottom:none}
.feed .t{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap;width:58px}
.feed .dir{font-size:10px;font-weight:700;letter-spacing:.06em;border-radius:4px;padding:1px 6px}
.feed .in{background:var(--ok-soft);color:var(--ok)} .feed .out{background:var(--accent-soft);color:var(--accent)}

.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:1100px){.two{grid-template-columns:1fr}}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.mini{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:12.5px}
.mini h4{font-size:12px;font-weight:700;margin-bottom:6px}
.mini .row{display:flex;justify-content:space-between;padding:3px 0;color:var(--muted)}
.mini .row b{color:var(--ink);font-variant-numeric:tabular-nums}
.footer-note{font-size:11.5px;color:var(--muted);margin-top:26px;border-top:1px solid var(--line);padding-top:10px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.thumb{border-radius:9px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:9.5px;font-weight:700;flex:none;box-shadow:inset 0 0 0 2px rgba(255,255,255,.14);text-shadow:0 1px 2px rgba(0,0,0,.25)}
.thumb.miss{background:repeating-linear-gradient(45deg,#EFEDE7 0 6px,#E2E0DA 6px 12px);color:var(--muted);border-style:dashed;font-weight:600;text-shadow:none}
.stars{color:#C99633;letter-spacing:1.5px;font-size:13px}
.lcgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;padding:14px 16px}
.lcstep{border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:12px}
.lcstep b{display:block;font-size:12.5px;margin-bottom:2px}
.lcstep span{color:var(--muted)}
.lcstep.done{border-left:3px solid var(--ok)}
.lcstep.pend{border-left:3px solid #D8D5CE;color:var(--muted)}
.p360head{display:flex;gap:16px;align-items:flex-start;padding:16px;flex-wrap:wrap}

input[type=checkbox]{width:15px;height:15px;accent-color:var(--accent);cursor:pointer;vertical-align:middle}
textarea{resize:vertical}
</style>


</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand"><b>BSC Ops Core</b></div>
    <div class="portals" id="portals"></div>
    <div class="pills">
      <div class="pill" id="pillEnigma"><span class="dot"></span>Enigma · synced 4 min ago</div>
      <div class="pill"><span class="dot amber"></span>Shopify · daily 02:00</div>
    </div>
  </div>
  <div class="main">
    <nav class="rail" id="rail"></nav>
    <div class="content" id="content"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ====================================================================
   BSC OPS CORE v11 — THE PLANNING LAYER
   Rebuilt after C1a (27 Aug): Enigma is the Bible; this system reads
   stock + masters + recipes from it, adds the planning brain the
   sheets do today, and pushes only approved decisions back.
   IA: L1 Masters (source-labelled) → L2 Health → L3 Planning →
   L4 Forecast → Sync & Rules.
==================================================================== */

/* ---------------- helpers ---------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
const badge = (t,k) => `<span class="badge b-${k}">${t}</span>`;
let toastT;
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),2600); }
function vhead(crumb,h,p,sp){
 const tag = sp==="mtm"?'<div><span class="spine sp-mtm">MTM · METRES</span></div>'
   : sp==="rtw"?'<div><span class="spine sp-rtw">RTW · PIECES</span></div>'
   : sp==="both"?'<div><span class="spine sp-both">BOTH SPINES</span></div>':'';
 return `<div class="vhead">${tag}<div class="crumb">${crumb}</div><h1>${h}</h1></div>`; }
function card(title, inner, right=""){ return `<div class="card"><div class="chead"><h2>${title}</h2><div class="right">${right}</div></div>${inner}</div>`; }
function tbl(cols, rows){ return `<div class="tblwrap"><table><thead><tr>${cols.map(c=>`<th class="${c.num?'num':''}">${c.h}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((c,i)=>`<td class="${cols[i]&&cols[i].num?'num':''}">${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`; }
const tabbar = (tabs, cur, fn) => `<div class="note" style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">${tabs.map(t=>`<button class="btn sm ${cur===t[0]?'primary':''}" onclick="${fn}('${t[0]}')">${t[1]}</button>`).join(" ")}</div>`;
const fld = (id,label,ph,wide) => `<label class="fld${wide?' wide':''}"><span>${label}</span><input id="${id}" placeholder="${ph||''}" autocomplete="off"></label>`;
const fldv = (id,label,val) => `<label class="fld"><span>${label}</span><input id="${id}" value="${val}" autocomplete="off"></label>`;
const sel = (id,label,opts,cur) => `<label class="fld"><span>${label}</span><select id="${id}">${opts.map(o=>`<option${o===cur?' selected':''}>${o}</option>`).join("")}</select></label>`;
const gv = id => { const e=document.getElementById(id); return e ? e.value.trim() : ""; };
const gnum = id => parseFloat(gv(id));

/* source-of-truth markers — every master column declares its writer */
const srcE = `<span class="chip" title="ENIGMA-owned. Read every 15 minutes. Never edited here — Enigma is the system of record for codes, stock, consumption and PO/GRN.">E</span>`;
const srcO = `<span class="chip" title="OPS CORE-owned. Lived on a sheet until now — entered and edited here, journalled.">O</span>`;
const SRC = {
 enigma: `<span class="badge b-mut" title="Read from Enigma every 15 minutes. Nothing here is typed.">SOURCE · ENIGMA</span>`,
 ops: `<span class="badge b-acc" title="Owned by this system. This data lived on Google Sheets until now.">SOURCE · OPS CORE (ex-sheet)</span>`,
 mixed: `<span class="badge b-warn" title="Enigma columns are read-only (E). Sheet-born planning columns live here (O).">SOURCE · MIXED — see column tags</span>`,
};

/* ---------------- decision journal (append-only) ---------------- */
let JOURNAL = [
 {when:"today 09:12", who:"system", what:"planning layer initialised", why:"system initialised"},
];
function jlog(what, why){ JOURNAL.unshift({when:"today", who:"Planner", what, why}); }

/* ---------------- RULES (ops-owned, editable) ---------------- */
let RULES = {
 rosWindow: 4,        // weeks averaged for true ROS
 minInstock: 4,       // consecutive in-stock weeks before ROS is trusted (4–6 weeks)
 reviewWks: 1,        // weekly review cycle
 nearRopPct: 15,      // % above ROP = "approaching"
 intlCoverWks: 14,    // international buy-to cover (12–16 weeks)
 unhealthyDefault: 10,// non-core unhealthy trigger, metres (under 10 m)
 rtwHealthyCycles: 2, // RTW healthy = main sizes last 2 lead cycles
};

/* ---------------- SEASONS (ops-owned) ---------------- */
let SEASONS = [
 {id:1, name:"Festive", months:"Oct–Dec", uplift:30, note:"vs last Oct–Dec"},
 {id:2, name:"Spring/Wedding", months:"Mar–Apr", uplift:15, note:"vs last Mar–Apr"},
 {id:3, name:"Lean", months:"May–Jul", uplift:-20, note:"summer dip"},
];
let seasonN = 4;
const NEXT = () => SEASONS[0]; // Festive is next (today = late Aug)

/* plan basis — one switch, every planning number follows it */
let planOn = "actual"; // 'actual' | 'projected'
function setPlan(p){ planOn=p; render(); toast(p==="projected" ? `Planning on PROJECTED demand (+${NEXT().uplift}% ${NEXT().name})` : "Planning on ACTUAL demand"); }
const planBar = () => `<div class="note" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><b>Plan on:</b>

/* ---------------- engine: ROS, states, proposals ---------------- */
function trueROS(f){
 let run=[]; // trailing consecutive in-stock weeks
 for(let i=f.weeks.length-1;i>=0;i--){ if(f.weeks[i][2]) run.unshift(f.weeks[i][1]); else break; }
 const used = run.slice(-RULES.rosWindow);
 const ros = used.length ? used.reduce((a,b)=>a+b,0)/used.length : 0;
 return {ros: Math.round(ros*10)/10, streak: run.length, trusted: run.length >= RULES.minInstock};
}
/* Last-year same-period rate of sale, per fabric. The projection is NOT
   "today x uplift" — it is "what this fabric did last Festive x the growth
   the business planned". Threshold and ROP suggestions follow the same basis. */
const LYROS = {
 "CTN-PPL-0412":158, "CTN-STR-0388":84, "CTN-OXF-0301":44, "DNM-IND-0104":29,
 "LUT-KNT-0021":102, "JPN-SLK-0007":19, "SOM-HRB-0119":22, "CHK-GLN-0512":2.9,
 "CHK-MDR-0507":2.0, "STR-BNG-0330":1.7, "PRT-PSL-0221":1.4, "DOB-TEX-0118":1.1,
 "TM-4408":12, "AL-2216":8,
};
function lyRosOf(f){ return LYROS[f.code] !== undefined ? LYROS[f.code] : Math.round(trueROS(f).ros*0.92*10)/10; }
function planROS(f){
 const t = trueROS(f);
 if(planOn!=="projected") return t;
 const proj = Math.round(lyRosOf(f)*(1+NEXT().uplift/100)*10)/10;
 return Object.assign({}, t, {ros: proj, ly: lyRosOf(f)});
}
function thrSuggest(f){ return planOn==="projected" ? Math.ceil(f.threshold*(1+NEXT().uplift/100)) : f.threshold; }
function ropSuggest(f){ const r=planROS(f); return Math.ceil(r.ros*(f.leadWks+RULES.reviewWks)+f.threshold); }
function coverWks(f){ const r=planROS(f); return r.ros>0 ? Math.round(((f.saleable-f.threshold)/r.ros)*10)/10 : null; }
function intlProposal(f){
 const r=planROS(f);
 const need = r.ros*RULES.intlCoverWks + f.threshold;
 const gap = need - f.saleable - f.inTransit;
 return gap>0 ? Math.ceil(gap/f.roll)*f.roll : 0;
}
function stateOf(f){
 if(f.bucket==="BESPOKE") return f.millAvail
  ? {k:"ok", label:"AVAILABLE at mill", act:"—"}
  : {k:"crit", label:"MILL SOLD OUT — hidden", act:"Auto-hidden on web + stores"};
 if(f.bucket==="NONCORE"){
  const uh = (RANGES.find(r=>r.name===f.range)||{}).unhealthyAt || RULES.unhealthyDefault;
  if(f.saleable<=f.threshold) return {k:"crit", label:"SOLD OUT (at threshold)", act:"Slot open → Launch engine"};
  if(f.saleable<=uh) return {k:"warn", label:"UNHEALTHY (≤"+uh+" m)", act:"Source replacement now — sells out in ~2 wks"};
  return {k:"ok", label:"HEALTHY", act:"—"};
 }
 // CORE
 const pos = f.saleable + f.inTransit;
 if(f.saleable<=f.threshold) return {k:"crit", label:"BELOW SAFETY — not sold", act:"Emergency order + investigate"};
 if(f.origin==="INTL"){
  const p = intlProposal(f);
  if(p>0) return {k:"crit", label:"ORDER NOW", act:"Proposal "+p+" m awaits approval"};
  return {k:"ok", label:"COVERED · "+coverWks(f)+" wk", act:"—"};
 }
 if(pos<=f.rop){
  if(!f.vendorCode) return {k:"crit", label:"AT ROP — NO VENDOR", act:"Auto-PO cannot fire: attach vendor in Enigma"};
  return {k:"warn", label:"AT ROP — auto-PO fires", act:"Enigma raises PO (monitor)"};
 }
 if(pos<=f.rop*(1+RULES.nearRopPct/100)) return {k:"warn", label:"NEAR ROP", act:"Expect auto-PO within days"};
 return {k:"ok", label:"HEALTHY", act:"—"};
}

function sizeCover(s){ return s.ros>0 ? Math.round((s.st/s.ros)*10)/10 : null; }
function styleState(st){
 const horizon = st.leadWks*RULES.rtwHealthyCycles;
 let broken=0, low=0;
 st.main.forEach(m=>{ const s=st.sizes[m]; if(!s||s.st===0) broken++; else if(sizeCover(s)!==null && sizeCover(s)<horizon) low++; });
 const totalRos = Object.values(st.sizes).reduce((a,s)=>a+s.ros,0);
 if(totalRos<1.5 && broken>0) return {k:"crit", label:"DYING", act:"Liquidate — markdown + pull-back"};
 if(broken>0) return {k:"crit", label:"BROKEN — main size out", act:"Replenish broken sizes first"};
 if(low>0) return {k:"warn", label:"UNHEALTHY — cover < "+horizon+" wk", act:"Reorder low sizes"};
 return {k:"ok", label:"HEALTHY", act:"—"};
}
function rtwProposal(st, sz){
 const s = st.sizes[sz]; const m = planOn==="projected" ? 1+NEXT().uplift/100 : 1;
 const ros = s.ros*m;
 const need = ros*(st.leadWks+RULES.reviewWks) + ros*2 - s.st;
 return need>0 ? Math.ceil(need/10)*10 : 0;
}

 const st=STYLES.find(x=>x.code===code); const q=rtwProposal(st,sz);
 RTWDONE[code+sz]=q; st.sizes[sz].st += q;

function missingFields(p){
 const miss=[];
 if(!p.cat) miss.push("category"); if(!p.sub1) miss.push("sub-cat 1"); if(!p.sub2) miss.push("sub-cat 2");
 if(!p.core) miss.push("core/non-core"); if(!p.collar) miss.push("collar"); if(!p.fit) miss.push("fit");

function prodStage(p){

 if(!p.lc.online && miss.length) return {k:"crit", label:"DRAFT — go-live BLOCKED", act:miss.length+" mandatory fields missing: "+miss.join(", ")};
 if(!p.lc.online) return {k:"warn", label:"READY — awaiting go-live", act:"Launch dates auto-stamp on Shopify go-live / first POS sale"};
 if(p.lc.pullback) return {k:"mut", label:"PULLED BACK", act:"→ "+p.lc.pullDest};
 if(p.lc.onHold) return {k:"warn", label:"ON HOLD", act:p.lc.holdReason+" · since "+p.lc.onHold};
 /* MTM: no finished stock and no sellable sizes — availability is driven by the FABRIC,
    read live from the MTM engine. RTW: driven by size stock across stores + WH. */
 if(p.biz==="MTM"){
  const f = FABRICS.find(x=>x.code===p.fabric);
  if(f){
   const fs = stateOf(f);
   if(fs.label.includes("SOLD OUT")||fs.label.includes("MILL SOLD OUT"))
    return {k:"crit", label:"SOLD OUT — fabric at threshold", act:"driven by "+p.fabric+", not size stock · auto-hidden on web + stores"};
   if(fs.label.includes("UNHEALTHY"))
    return {k:"warn", label:"AT RISK — fabric unhealthy", act:"replacement being sourced · "+p.fabric+" ≈2 wks left"};
   if(fs.label.includes("BELOW SAFETY"))
    return {k:"crit", label:"NOT SELLABLE — below safety floor", act:"fabric reserved for alterations only"};
  }
 }
 if(p.lc.soldOut) return {k:"crit", label:"SOLD OUT", act:"auto-stamped: all sellable sizes 0 across stores + WH"};
 if(p.lc.saleStart) return {k:"warn", label:"ON SALE (EOSS)", act:"₹"+fmt(p.mrpSale)+" since "+p.lc.saleStart+" · original ₹"+fmt(p.mrp)+" preserved"};
 return {k:"ok", label:"LIVE", act:"—"};
}

const HUES = {White:["#F2F0EA",1],Sand:["#D8C49A",1],Multi:["#B4552D",0],Sky:["#A9C9E8",1],Rust:["#B4552D",0],Navy:["#233049",0],Olive:["#6B7448",0],Moss:["#5C6644",0],Blue:["#4C6E9E",0],Grey:["#9AA0A8",0],Ecru:["#E6DEC8",1],Stone:["#CBC3B2",1]};
function swatchCSS(p){
 const hue = HUES[p.colour]||["#8B8F97",0]; const c = hue[0];
 let bg = c;
 if(/Stripe/i.test(p.pattern)) bg = `repeating-linear-gradient(90deg, ${c} 0 6px, #FFFFFFB3 6px 8px)`;
 else if(/Check|Houndstooth|Gingham/i.test(p.pattern)) bg = `repeating-linear-gradient(0deg, ${c} 0 7px, #FFFFFF80 7px 9px), repeating-linear-gradient(90deg, ${c} 0 7px, #FFFFFF80 7px 9px)`;
 else if(/Print/i.test(p.pattern)) bg = `radial-gradient(circle at 30% 30%, #FFFFFFB0 2.5px, transparent 3.5px), radial-gradient(circle at 72% 64%, #FFFFFFB0 2.5px, transparent 3.5px), radial-gradient(circle at 55% 20%, #FFFFFF80 2px, transparent 3px), ${c}`;
 else if(/Dobby|Herringbone|Jacquard/i.test(p.pattern)) bg = `repeating-linear-gradient(45deg, ${c} 0 5px, #FFFFFF59 5px 7px)`;
 return {bg, ink: hue[1] ? "#3A3F47" : "#FFFFFF"};
}

V.pm_r_nc   = () => { pmCoreTab="Non-Core"; view="pm_master_r"; return V.pm_master_r(); };
function pmMasterBody(){
 const wsNote = pmLock ? ` This is the ${pmLock} view of the one shared master — the same product opened from the other workspace is the same record.` : "";
 return vhead(pmLock ? pmLock : "Product","Products","Every product the business sells, in one place. A product cannot go live until every mandatory field is complete; lifecycle dates stamp themselves. Click a product for its full record."+wsNote, pmLock ? (pmLock==="MTM"?"mtm":"rtw") : "both") +
 prodActionCard() +
 (()=>{
  const nM = PRODUCTS.filter(x=>x.biz==="MTM").length, nR = PRODUCTS.filter(x=>x.biz==="RTW").length;
  const rows = PRODUCTS.filter(p=>(pmTab==="all"||p.biz===pmTab) && (!pmLock || pmCoreTab==="all" || p.core===pmCoreTab));
  const tabs = pmLock ? (
    [["all","All"],["Core","Core"],["Non-Core","Non-core"]]
     .map(([id,label])=>`<button class="btn sm ${pmCoreTab===id?'primary':''}" onclick="pmCoreSet('${id}')">${label} · ${PRODUCTS.filter(p=>p.biz===pmLock&&(id==="all"||p.core===id)).length}</button>`).join(" ")
    )
   : [["all","All",PRODUCTS.length],["MTM","MTM · fabric is the product",nM],["RTW","RTW · garment × size",nR]]
   .map(([id,label,n])=>`<button class="btn sm ${pmTab===id?'primary':''}" onclick="pmSetTab('${id}')">${label} · ${n}</button>`).join(" ");
  const isM = pmTab==="MTM", isR = pmTab==="RTW";
  const cols = [{h:""},{h:"Image"},{h:"Product"},{h:"Biz"},{h:"Category"},{h:"Core"},
   {h: isM ? "Customisation set" : "Attributes"},
   {h:"Fabric "+srcE}]
   .concat(isR?[{h:"Sizes"}]:isM?[{h:"Fabric state (live)"}]:[])
   .concat([{h:"MRP",num:1},{h:"Stage"},{h:"Actions"}]);
  return card(`Products`, tbl(cols,
   rows.map(p=>{
    const st = prodStage(p); const f = FABRICS.find(x=>x.code===p.fabric); const fs = f?stateOf(f):null;
    const base = [`<input type="checkbox" ${SEL.prod.has(p.id)?"checked":""} onclick="selTog('prod',${p.id})" title="select for bulk edit">`, thumb(p),
     `<span class="codelink" onclick="prodOpen(${p.id})" title="Open the full product record">${p.design}</span><span class="sub2">${p.name}</span>`,
     badge(p.biz, p.biz==="MTM"?"acc":"mut"),
     [p.cat,p.sub1,p.sub2].filter(Boolean).join(" → ")||badge("missing","crit"),
     p.core||badge("—","crit"),
     [p.collar,p.fit,p.sleeve,p.pattern].filter(x=>x&&x!=="—").join(" · "),
     p.fabric?`<span class="codelink" onclick="fabOpen('${p.fabric}')">${p.fabric}</span>`:badge("not linked","crit")];
    const mid = isR?[p.sizes||badge("missing","crit")] : isM?[fs?badge(fs.label,fs.k):"—"] : [];
    return base.concat(mid, [
     "₹"+fmt(p.mrpCur)+(p.mrpSale?`<span class="sub2" style="text-decoration:line-through">₹${fmt(p.mrp)}</span>`:""),
     badge(st.label,st.k),
     prodActBtns(p, st)]);
   })), tabs);
 })()  +
 prodBulkCard();
};

V.pm_360 = () => {

 const rtw = STYLES.find(s=>s.code===p.design);
 const lcSteps = [
  ["Launch · Online", p.lc.online, "stamps itself on Shopify go-live"],
  ["Launch · POS", p.lc.pos, "stamps itself on the first POS sale"],
  ["Sold Out", p.lc.soldOut, p.biz==="MTM"?"stamps itself when the fabric hits threshold":"stamps itself when all sellable sizes = 0 (stores + WH)"],
  ["On Hold", p.lc.onHold ? p.lc.onHold+" · "+(p.lc.holdReason||"") : null, "manual — a reason code is mandatory"],
  ["Sale (EOSS)", p.lc.saleStart ? p.lc.saleStart+" · ₹"+fmt(p.mrpSale)+" (orig ₹"+fmt(p.mrp)+" kept)" : null, "sale MRP recorded; original price never overwritten"],
  ["Pullback", p.lc.pullback ? p.lc.pullback+" → "+(p.lc.pullDest||"") : null, "destination recorded on recall / consolidation"],
 ];
 return vhead("Product","Product 360 — "+p.design, p.name, "both") +
 prodActionCard() +
 card("", `<div class="p360head">
   ${thumb(p, 96)}
   <div style="flex:1;min-width:220px">
    <div style="font-size:16px;font-weight:700">${p.name} ${badge(p.biz, p.biz==="MTM"?"acc":"mut")} ${/^[A-Z]{2,3}-\d{4}-\d{4}$/.test(p.design)?badge("unique design code","ok"):p.biz==="RTW"?badge("legacy code · new code at migration","mut"):""}</div>

   </div>
   <div style="text-align:right">
    <div style="font-size:19px;font-weight:700">₹${fmt(p.mrpCur)}</div>
    ${p.mrpSale?`<div class="sub2" style="text-decoration:line-through">₹${fmt(p.mrp)} original</div>`:`<div class="sub2">original MRP</div>`}
    <div style="margin-top:8px">${prodActBtns(p, st)}</div>
   </div>

 card("Lifecycle", `<div class="lcgrid">` +
  lcSteps.map(s=>`<div class="lcstep ${s[1]?'done':'pend'}"><b>${s[0]}</b>${s[1]||'<span style="color:var(--muted)">—</span>'}<span style="display:block;margin-top:3px;font-size:10.5px">${s[2]}</span></div>`).join("") + `</div>`) +
 `<div class="two">` + (
  card(p.biz==="MTM"?"Fabric facts + listing":"Attributes", tbl([{h:"Field"},{h:"Value"},{h:"Owned by"}],[
   [p.biz==="MTM"?"Collar (customer picks from)":"Collar", p.collar||badge("missing","crit"), "listing"],
   [p.biz==="MTM"?"Fit (customer picks from)":"Fit", p.fit||badge("missing","crit"), "listing"],
   ["Sleeve", p.sleeve||badge("missing","crit"), "listing"],
   ["Design pattern", p.pattern||badge("missing","crit"), p.biz==="MTM"?badge("from fabric","mut"):"listing"],
   ["Colour", p.colour||badge("missing","crit"), p.biz==="MTM"?badge("from fabric","mut"):"listing"],
   ["Origin", p.origin||badge("missing","crit"), p.biz==="MTM"?badge("from fabric","mut"):"listing"],
   ["Core / Non-core", p.core||badge("missing","crit"), p.biz==="MTM"?badge("from fabric","mut"):"listing"],
   ["Fabric", p.fabric?`<span class="codelink" onclick="fabOpen('${p.fabric}')">${p.fabric}</span>`+(f?` <span class="sub2" style="display:inline">${f.name}</span>`:""):badge("not linked","crit"), p.biz==="MTM"?badge("this IS the record","acc"):"BOM input"],
   ["Sizes", p.sizes||badge("missing","crit"), "listing"],
   ["MRP", "₹"+fmt(p.mrpCur), "listing"],
   ["Image", p.img?"Picario · "+p.design+".jpg":badge("missing — filename mismatch","crit"), "listing"]])) +
  card(p.biz==="MTM"?"Availability — follows the fabric":"Availability — follows size stock",
   p.biz==="MTM"
    ? (f ? tbl([{h:"Fabric"},{h:"Saleable",num:1},{h:"Threshold",num:1},{h:"State"}],
        [[`<span class="code">${f.code}</span>`, f.saleable===null?"mill stock":fmt(f.saleable)+" m", f.threshold===null?"—":fmt(f.threshold)+" m", badge(fs.label,fs.k)]]) : `<div class="formnote">No fabric linked yet.</div>`)
    : (rtw ? tbl([{h:"Size"},{h:"Stock",num:1},{h:"ROS /wk",num:1}],
        Object.keys(rtw.sizes).map(sz=>[sz+(rtw.main.includes(sz)?" ●":""), fmt(rtw.sizes[sz].st), fmt(rtw.sizes[sz].ros)])) : `<div class="formnote">Size stock arrives from Enigma once the product is live.</div>`))
 ) + `</div>` +
 card("Performance", tbl([{h:"Metric"},{h:"Value"}],[
  ["6-week rate of sale", p.ros6 ? fmt(p.ros6)+(p.biz==="MTM"?" m/wk (from the fabric)":" pc/wk") : "— (not launched)"],
  ["Days since launch", p.days||"—"],
  ["Feedback on record", FEEDBACK.filter(x=>x.style.includes(p.name)||x.style.includes(p.design)).reduce((a,x)=>a+x.n,0)+" notes"]]));
};

V.rep_fabric = () => vhead("Reports","Fabric Sold Out / On Hold","Computed live from the MTM engine — replaces the hand-maintained on-hold list (3,042 fabrics held by hand today).","mtm") +
 card("Sold out / on hold", tbl([{h:"Fabric"},{h:"Bucket"},{h:"Why"},{h:"Since"},{h:"Products affected"}],
  FABRICS.filter(f=>{ const s=stateOf(f); return s.label.includes("SOLD OUT")||s.label.includes("MILL"); }).map(f=>{
   const s=stateOf(f);
   return [codeCell(f), f.bucket, badge(s.label,s.k), "this week",
    PRODUCTS.filter(p=>p.fabric===f.code).map(p=>`<span class="codelink" onclick="prodOpen(${p.id})">${p.design}</span>`).join(" ")||"—"]; })));

V.rep_ros = () => vhead("Reports","Top 6W ROS + Indexing","Six-week rate of sale, indexed against the category median — outperformers get protected availability, underperformers surface early.","both") +
 card("Ranked", tbl(
  [{h:"Image"},{h:"Product"},{h:"6W ROS",num:1},{h:"Index vs median",num:1},{h:"Read"}],
  (()=>{ const live=PRODUCTS.filter(p=>p.ros6>0);
   const med = live.map(p=>p.ros6).sort((a,b)=>a-b)[Math.floor(live.length/2)]||1;
   return live.sort((a,b)=>b.ros6-a.ros6).map(p=>{ const ix=Math.round(p.ros6/med*100);
    return [thumb(p,36), `<span class="codelink" onclick="prodOpen(${p.id})">${p.design}</span> ${p.name}`, fmt(p.ros6), ix,
     ix>=150?badge("Outperformer — protect availability","ok"):ix<50?badge("Underperformer — review","warn"):"—"]; }); })()));

V.rep_stage = () => {
 const stages = {};
 PRODUCTS.forEach(p=>{ const s=prodStage(p).label; stages[s]=(stages[s]||0)+1; });
 return vhead("Reports","Lifecycle Stage","Where every product stands right now, split by spine — and who acts on each state.","both") +
 card("Lifecycle stage", tbl([{h:"Stage"},{h:"MTM",num:1},{h:"RTW",num:1},{h:"Total",num:1},{h:"Who acts"}],
  Object.keys(stages).map(s=>{
   const m = PRODUCTS.filter(p=>p.biz==="MTM"&&prodStage(p).label===s).length;
   const r = PRODUCTS.filter(p=>p.biz==="RTW"&&prodStage(p).label===s).length;
   return [badge(s, s.includes("BLOCKED")||s.includes("SOLD")?"crit":s==="LIVE"?"ok":"warn"), fmt(m), fmt(r), fmt(stages[s]),
    s.includes("BLOCKED")?"Merchandising — complete the fields":s==="ON HOLD"?"Owner of the reason code":s==="ON SALE (EOSS)"?"Retail ops":s.includes("fabric")?"Sourcing — fabric-driven":"—"]; })));
};
V.pm_lifecycle = () => V.rep_stage();

 {id:1, name:"Cord Overshirt Rust", cat:"RTW Shirts", sub:"Overshirt", drop:"OCT-26", mood:"figma.com/moods/cord-aw26", state:"Sampling"},
 {id:2, name:"Pleated Chino Stone", cat:"RTW Bottoms", sub:"Chino", drop:"OCT-26", mood:"pinterest.com/bsc/pleats", state:"Concept"},
 {id:3, name:"Flannel Overshirt Moss", cat:"RTW Shirts", sub:"Overshirt", drop:"SEP-26", mood:"—", state:"Pilot"},
];
let npdN = 4;
function npdAdd(){
 const name=gv("np_name"), drop=gv("np_drop");
 if(!name){ toast("Concept name is mandatory"); return; }
 NPD.unshift({id:npdN++, name:esc(name), cat:gv("np_cat"), sub:esc(gv("np_sub"))||"—", drop, mood:esc(gv("np_mood"))||"—", state:"Concept"});
 jlog(`NPD brief created: ${name} → ${drop}`, "concept"); render(); toast("Brief created · assigned to "+drop+" drop");
}
function npdAdvance(id){
 const n = NPD.find(x=>x.id===id); const order=["Concept","Sampling","Pilot","Approved"];
 const i = order.indexOf(n.state); if(i<order.length-1){ n.state=order[i+1]; jlog(`${n.name} → ${n.state}`, "NPD gate"); render(); toast(n.name+" moved to "+n.state); }
}
function npdBody(){ return "" +
 card("Briefs", tbl([{h:"Concept"},{h:"Category"},{h:"Drop"},{h:"Mood board"},{h:"Stage"},{h:""}],
  NPD.map(n=>[`<b>${n.name}</b>`, n.cat+" → "+n.sub, n.drop, n.mood==="—"?"—":`<span class="code">${n.mood}</span>`,
   badge(n.state, n.state==="Approved"?"ok":n.state==="Concept"?"mut":"warn"),
   n.state!=="Approved"?`<button class="btn sm primary" onclick="npdAdvance(${n.id})">Advance →</button>`:""]))) +
 card("New brief", `<div class="entry">`+fld("np_name","Concept name","Seersucker Camp Shirt",1)+sel("np_cat","Category",VOCAB.cats)+fld("np_sub","Sub-category","Camp")+sel("np_drop","Drop",DROPS.map(d=>d.name))+fld("np_mood","Mood board link","figma / pinterest URL",1)+`<button class="btn primary" onclick="npdAdd()">Create brief</button></div>`);
}

function sampleAdd(){

function sampleMove(id, to){

 if(to==="Rejected"){ s.round++; s.state="Pending"; toast("Rejected → new revision round "+s.round+" opened automatically"); jlog(`Sample ${s.style} rejected → round ${s.round}`, "sampling"); render(); return; }
 jlog(`Sample ${s.style} → ${to}`, "sampling"); render(); toast("Sample "+to.toLowerCase());

   badge(s.state, s.state==="Approved"?"ok":s.state==="Rejected"?"crit":s.state==="In progress"?"warn":"mut"),
   s.state==="Pending"?`<button class="btn sm" onclick="sampleMove(${s.id},'In progress')">Start</button>`

}

const INV_STORES = () => STORES.filter(s=>s.inv);
function storeStock(code){
 const st = STYLES.find(s=>s.code===code); if(!st) return null;
 const stores = INV_STORES(); const out = {WH:{}, stores:{}};
 let seed = code.split("").reduce((a,c)=>a+c.charCodeAt(0),0);
 const rnd = () => { seed=(seed*9301+49297)%233280; return seed/233280; };
 Object.keys(st.sizes).forEach(sz=>{
  const total = st.sizes[sz].st; let left = total;
  stores.forEach(s=>{ const share = total===0?0:Math.min(left, Math.floor(total*0.04*(0.5+rnd()))); out.stores[s.name] = out.stores[s.name]||{}; out.stores[s.name][sz] = {sell:share, disp: st.main.includes(sz)&&rnd()<0.85?1:0, fit: rnd()<0.25?1:0}; left -= share; });
  out.WH[sz] = left;
 });
 return out;
}

/* ==================================================================
   SALES SERIES — weekly units per product (deterministic), channel + new/repeat split
================================================================== */
const unitsWk = p => p.biz==="MTM" ? Math.round((p.ros6||0)/1.6*10)/10 : (p.ros6||0);
const SERIES_CACHE = {};
function series(p){
 if(SERIES_CACHE[p.id] && SERIES_CACHE[p.id].base===unitsWk(p)) return SERIES_CACHE[p.id].w;
 const base = unitsWk(p); let seed = p.id*7919+13; const rnd=()=>{ seed=(seed*9301+49297)%233280; return seed/233280; };
 const wksLive = p.lc.online ? Math.max(1, Math.round((p.days||7)/7)) : 0;
 const n = Math.min(16, wksLive); const w=[];
 for(let i=0;i<n;i++){ /* index 0 = oldest of the last n weeks; launch curve: first weeks run higher */
  const age = wksLive - n + i + 1; const launchBoost = age<=3 ? 1.35 : age<=6 ? 1.1 : 1;
  const u = Math.max(0, Math.round(base*launchBoost*(0.8+rnd()*0.4)));
  const online = Math.round(u*(p.biz==="MTM"?0.18:0.32)*(0.7+rnd()*0.6)); const newC = Math.round(u*(0.45+rnd()*0.2));
  w.push({age, units:u, online:Math.min(u,online), offline:u-Math.min(u,online), newC:Math.min(u,newC), repeat:u-Math.min(u,newC), rev:u*p.mrpCur});
 }
 SERIES_CACHE[p.id]={base, w}; return w;
}
let repTF = "LW";
const TF_WEEKS = {LW:1, "LW-1":1, L4W:4, MTD:daysBetween(new Date(2026,8,1),TODAY)/7, QTD:daysBetween(new Date(2026,6,1),TODAY)/7, YTD:daysBetween(new Date(2026,3,1),TODAY)/7};
function tfSum(p, tf, key){
 const w=series(p); const k=TF_WEEKS[tf]; if(!w.length) return 0;
 if(tf==="LW-1") return w.length>1 ? w[w.length-2][key] : 0;
 const full=Math.floor(k), frac=k-full; let s=0;
 for(let i=0;i<full && i<w.length;i++) s+=w[w.length-1-i][key];
 if(frac>0 && full<w.length) s+=w[w.length-1-full][key]*frac;
 return Math.round(s);
}

function poBulkParse(){
 const txt = gv("pb_csv"); if(!txt){ toast("Paste rows first — one PO per line"); return; }
 const lines = txt.split(/\n/).map(l=>l.trim()).filter(Boolean); const out=[];
 lines.forEach((l,i)=>{ const c=l.split(",").map(x=>x.trim()); const [id,vendor,what,qty,unit,value,spine]=c; const err=[];
  if(!/^PO-\d{4}$/.test(id||"")) err.push("PO id must be PO-####"); if(POS2.some(o=>o.id===id)||out.some(o=>o.id===id)) err.push("duplicate PO id");
  if(!VENDORS.some(v=>v.v===vendor)) err.push("vendor not in master"); if(!what) err.push("description missing");
  if(isNaN(parseFloat(qty))) err.push("qty not a number"); if(!["pc","m"].includes(unit)) err.push("unit must be pc or m"); if(isNaN(parseFloat(value))) err.push("value not a number"); if(!["MTM","RTW"].includes(spine)) err.push("spine must be MTM or RTW");
  out.push({row:i+1, id, vendor, what, qty, unit, value:parseFloat(value), spine, err}); });

  fld("pn_sizes",pmTab==="MTM"?"Sizes":"Size range",pmTab==="MTM"?"28 MTM sizes":"36–44")+fld("pn_mrp","Original MRP","5200")+
  `<button class="btn primary" onclick="prodAdd()">Create</button></div>`;
}

/* ==================================================================

================================================================== */
let storeN = 12;
function storeAdd(){
 const name=gv("sn_name"), city=gv("sn_city"), fmtv=gv("sn_fmt"), opened=gv("sn_open");
 if(!name||!city||!opened){ toast("Name, city and opening date are mandatory"); return; }
 STORES.push({id:storeN++, name:esc(name), city:esc(city), fmt:fmtv, target:0, actual:0, rosPlan:0, rosAct:0, inv:gv("sn_inv")==="Yes", opened:esc(opened), ly:null});
 const f=STOREFMT.find(x=>x.fmt===fmtv); if(f) f.stores++;
 jlog(`Store added: ${name} (${fmtv}) · opens ${opened}`, "store master"); render(); toast("Store added — non-comparable for SSSG until 12 months; display capacity added to the option plan");
}
V.stores = () => vhead("RTW · Stores","Store List","","both") +
 `<div class="kpis"><div class="kpi"><b>${STOREFMT.reduce((a,s)=>a+s.stores,0)}</b><span>stores</span></div><div class="kpi"><b>${STORES.filter(s=>s.inv).length}</b><span>hold sellable inventory</span></div><div class="kpi"><b>${STORES.filter(s=>s.opened.length>4).length}</b><span>opened < 12 months · non-SSSG</span></div><div class="kpi"><b>${fmt(STOREFMT.reduce((a,s)=>a+s.stores*s.cap,0))}</b><span>display slots · all formats</span></div></div>` +
 card("Stores with a stock position", tbl([{h:"Store"},{h:"City"},{h:"Format"},{h:"Holds inventory"},{h:"Opened"},{h:"SSSG basis"},{h:"Display capacity",num:1},{h:"ROS /wk",num:1}],
  STORES.map(s=>[`<b>${s.name}</b>`, s.city, s.fmt, s.inv?badge("Yes","ok"):badge("Display / MTO only","mut"), s.opened, s.opened.length>4?badge("New store","acc"):badge("Comparable","ok"), fmt((STOREFMT.find(x=>x.fmt===s.fmt)||{}).cap), fmt(s.rosAct)]))) +
 card("Formats", tbl([{h:"Format"},{h:"Stores",num:1},{h:"Display capacity / store",num:1},{h:"Total slots",num:1}], STOREFMT.map(s=>[s.fmt, fmt(s.stores), fmt(s.cap), fmt(s.stores*s.cap)]))) +
 card("New store", `<div class="entry">`+fld("sn_name","Name","e.g. Phoenix Palladium")+fld("sn_city","City","Mumbai")+sel("sn_fmt","Format",STOREFMT.map(s=>s.fmt))+fld("sn_open","Opens","e.g. 2026 Nov")+sel("sn_inv","Holds inventory",["No","Yes"])+`<button class="btn primary" onclick="storeAdd()">Add store</button></div>`);

let view="cockpit", openMod="g_m0";
function go(v){ view=v; render(); const m=findMod(v); if(m) openMod=m; buildRail(); }
function findMod(v){ for(const n of NAV){ if(n.groups) for(const g of n.groups){ if(g.kids.some(k=>k[0]===v)) return g.id; } } return null; }
function buildRail(){
 $("#rail").innerHTML = NAV.map(n=>{
  if(n.solo) return `<div class="mod"><button class="lvl1 ${view===n.id?"on1":""}" onclick="go('${n.id}')">${n.label}</button></div>`;
  return `<div class="sec ${n.cls}"><div class="sechead">${n.sec}<span>${n.note}</span></div>` +
   n.groups.map(g=>{
    const open = openMod===g.id || g.kids.some(k=>k[0]===view);
    return `<div class="mod ${open?"open":""}"><button class="lvl2" onclick="tog('${g.id}')">${g.label}<span class="chev">▶</span></button>
      <div class="sub">${g.kids.map(k=>`<button class="${view===k[0]?"on":""}" onclick="go('${k[0]}')">${k[1]}</button>`).join("")}</div></div>`;
   }).join("") + `</div>`;
 }).join("");
}
function tog(id){ openMod = openMod===id? null : id; buildRail(); }
function buildPortals(){ $("#portals").innerHTML = `<button class="on">Ops Core · Planning Layer</button>`; }
function render(){
 $("#content").innerHTML = (V[view]||V.cockpit)() + `<div class="footer-note">BSC Ops Core · DevX Labs × Bombay Shirt Company</div>`;
 $("#content").scrollTop=0;
}
buildPortals(); buildRail(); render();
